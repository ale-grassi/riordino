[project]
name = "riordino"
version = "0.0.dev0"
description = "Intelligent scanned PDF organizer — splits bulk scans into separate, well-named documents using AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Alessandro Grassi" },
]
keywords = ["pdf", "scanner", "ocr", "gemini", "document-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.25",
    "pytesseract>=0.3.10",
    "google-genai>=1.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
riordino = "riordino:main"

[project.urls]
Repository = "https://github.com/ale-grassi/riordino"
Issues = "https://github.com/ale-grassi/riordino/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "build>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["riordino"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
